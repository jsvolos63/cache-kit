# CI for this kit — runs through the family's reusable workflow, which owns
# the checkout/node/install skeleton, the CLAUDE.md family-conventions check,
# and the version-bump guard (consumers pin by commit SHA and releases tag by
# version, so a shipped-module change without a bump ships two different SHAs
# under one version label). One place to fix a CI step for the whole family:
# vendor-cli's .github/workflows/family-ci.yml.
name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  family-ci:
    uses: jsvolos63/vendor-cli/.github/workflows/family-ci.yml@main
    with:
      run: |
        node --check index.js
        npm test
      version-guard-paths: index.js bin
